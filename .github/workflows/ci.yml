name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Check installer syntax
        run: sh -n install.sh

      - name: Smoke-test installer
        working-directory: ${{ runner.temp }}
        run: |
          UPKEEP_BIN_DIR="$RUNNER_TEMP/upkeep/bin" \
          XDG_CONFIG_HOME="$RUNNER_TEMP/upkeep/config" \
          "$GITHUB_WORKSPACE/install.sh"
          test -x "$RUNNER_TEMP/upkeep/bin/upkeep"
          test -f "$RUNNER_TEMP/upkeep/config/upkeep/config.toml"

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -buildvcs=false ./...
