name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Check installer syntax
        run: |
          for script in install.sh install_test.sh; do
            sh -n "$script"
          done

      - name: Smoke-test installer
        run: sh install_test.sh

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build release-style binary
        env:
          RELEASE_TAG: v0.0.0-ci
        run: |
          CGO_ENABLED=0 go build -trimpath -buildvcs=false \
            -ldflags "-X main.version=$RELEASE_TAG" \
            -o "$RUNNER_TEMP/upkeep" .
          test "$("$RUNNER_TEMP/upkeep" --version)" = "upkeep $RELEASE_TAG"
