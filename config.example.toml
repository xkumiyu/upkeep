# Copy this file to ~/.config/upkeep/config.toml and edit the jobs below.
# Each job runs one shell command. Combine multiple operations with &&.
# scope defaults to "user". Use scope = "system" for a job that may require sudo.

# Settings below are optional. Leave them commented out to use the defaults.
#
# interval = "168h"        # Default interval for jobs without their own interval.
# snooze = "24h"            # Wait this long after declining an approval prompt.
# approval_timeout = "60s"  # Wait this long for an approval response.

[[jobs]]
name = "user-packages"
command = ":"
# Replace the no-op command above with the package manager command used on this machine.

# Debian/Ubuntu example. Uncomment and adjust as needed.
