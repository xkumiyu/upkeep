# Optional approval settings:
# snooze = "24h"            # Suppress a workflow's prompts after a decline.
# approval_timeout = "60s"  # Time allowed for an approval response.

[[workflows]]
name = "dev-tools"
interval = "168h" # Required positive duration; starts when the workflow finishes.

[[workflows.jobs]]
name = "mise"
command = "mise up"

# Every job belongs to its enclosing workflow. Job names must be unique
# within a workflow, but can be reused in another workflow.

